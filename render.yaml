services:
  # PostgreSQL Database
  - type: pserv
    name: alphapath-db
    runtime: docker
    plan: free
    region: oregon
    ipAllowList: []

  # API Service
  - type: web
    name: alphapath-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: alphapath-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
